<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent & MCP Ontology Dashboard (2026)</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600;800&display=swap" rel="stylesheet">
    <!-- D3.js CDN -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="glass-container">
        <header class="dashboard-header">
            <div class="logo-area">
                <h1>AI Agent <span class="highlight">Ontology</span> 2026</h1>
                <p>Interactive Network of Technical Specs & Trends</p>
            </div>
            <div class="header-controls">
                <span class="status-indicator online">System Online</span>
            </div>
        </header>

        <main class="content-area">
            <div id="graph-wrapper" class="glass-panel">
                <!-- D3 Graph will be rendered here -->
            </div>

            <aside id="details-panel" class="glass-panel info-sidebar hidden">
                <div class="panel-header">
                    <h2 id="node-label">Select a Node</h2>
                    <button id="close-panel-btn">&times;</button>
                </div>
                <div class="panel-body">
                    <div id="node-type-badge" class="badge"></div>
                    <p id="node-desc">Click on any node in the graph to view technical specifications and relationships.
                    </p>
                    <div id="node-connections"></div>
                </div>
            </aside>
        </main>

        <footer class="dashboard-footer glass-panel">
            <div class="legend-container">
                <div class="legend-item"><span class="dot entity"></span> Entity</div>
                <div class="legend-item"><span class="dot governance"></span> Governance</div>
                <div class="legend-item"><span class="dot infrastructure"></span> Infrastructure</div>
                <div class="legend-item"><span class="dot resource"></span> Resource</div>
            </div>
            <div class="credits">
                Generated by Antigravity
            </div>
        </footer>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>

</html>
